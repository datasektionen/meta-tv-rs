services:
  app:
    build:
      dockerfile: ./Dockerfile.dev
    ports:
      - 8000:8000
    environment:
      - ROCKET_DATABASES={sea_orm={url="postgresql://postgres:postgres@db/metatv"}}
      - ROCKET_OIDC={issuer_url="http://localhost:7003",client_id="client-id",client_secret="client-secret",redirect_url="http://localhost:8000/auth/oidc-callback"}
      - ROCKET_HIVE={url="http://nyckeln:7004/api/v1",secret="secret"}
      - ROCKET_SECRET_KEY=2hMUcPB1UjTd2W8aZDBxoUC27R0z9c56992m3x2MTE4D
      - ROCKET_ADDRESS=0.0.0.0
      - ROCKET_PORT=8001
      - ROCKET_LIMITS={file="50MiB", data-form="51MiB"}
      - ROCKET_S3={url="http://localhost:9090", bucket="meta-tv", use_mock=true}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - FEED_ENTRY_DURATION=30000
    configs:
    - source: nginx.conf
      target: /etc/nginx/nginx.conf
    # The source code is mounted into the container and rebuilt on changes (see
    # dev-entrypoint.sh). Build artifacts are kept in volumes so that they
    # survive restarts and don't mix with the host's `target/`.
    volumes:
      - ./:/app
      - target:/app/target
      - cargo-registry:/usr/local/cargo/registry
      - cache:/root/.cache
    init: true
    depends_on:
      db:
        condition: service_healthy
      nyckeln:
        condition: service_healthy
  db:
    image: postgres:15
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=metatv
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "sh -c 'pg_isready -d metatv -U postgres'"
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 10s
  s3:
    image: adobe/s3mock:latest
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=meta-tv
      - COM_ADOBE_TESTING_S3MOCK_STORE_REGION=eu-west-1
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
    ports:
      - 9090:9090
  nyckeln:
    image: ghcr.io/datasektionen/nyckeln-under-dorrmattan
    configs:
      - source: nyckeln.yaml
        target: /config.yaml
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7001 && nc -z localhost 7002 && nc -z localhost 7003 && nc -z localhost 7004"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    ports:
      - 7001:7001
      - 7002:7002
      - 7003:7003
      - 7004:7004

volumes:
  target:
  cargo-registry:
  cache:

configs:
  nginx.conf:
    content: |
      events {}

      http {
        # Forwards everything to the backend, except for trunk's websocket
        # used to reload the page when the frontend has been rebuilt.
        server {
          listen 8000;

          client_max_body_size 51M;

          location /.well-known/trunk/ws {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade websocket;
            proxy_set_header Connection upgrade;
            proxy_read_timeout 1d;
          }

          location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $$http_host;
            # Needed for server-sent events.
            proxy_buffering off;
            proxy_read_timeout 1d;

            # Normally `trunk serve` fills in these placeholders in the
            # auto-reload script, but here the backend serves the files.
            sub_filter '{{__TRUNK_ADDRESS__}}' '$$http_host';
            sub_filter '{{__TRUNK_WS_BASE__}}' '/';
          }
        }
        server {
          listen 7003;

          location / {
            proxy_pass http://nyckeln:7003;
          }
        }
        server {
          listen 7004;

          location / {
            proxy_pass http://nyckeln:7004;
          }
        }
        server {
          listen 9090;

          location / {
            proxy_pass http://s3:9090;
          }
        }
      }

  nyckeln.yaml:
    content: |
      clients:
        - id: client-id
          secret: client-secret
          redirect_uris:
            - "http://localhost:8000/auth/oidc-callback"

      users:
        - ug_kth_id: some-id
          kth_id: turetek
          email: turetek@kth.se
          first_name: Ture
          family_name: Teknolog
        - ug_kth_id: some-other-id
          kth_id: diadat
          email: diadat@kth.se
          first_name: Diana
          family_name: Datalog
        - ug_kth_id: yet-another-id
          kth_id: marmed
          email: marmed@kth.se
          first_name: Martin
          family_name: Median
        - ug_kth_id: even-more
          kth_id: karklu
          email: karklu@kth.se
          first_name: Karin
          family_name: Klubbare

      hive:
        groups:
          - name: Systemansvarig
            id: d-sys
            domain: example.com
            members:
              - turetek
            permissions:
              - id: admin
                scope: null
            tags:
              - id: slide-manager
          - name: METAdorerna
            id: metadorerna
            domain: example.com
            members:
              - diadat
              - marmed
            tags:
              - id: slide-manager

